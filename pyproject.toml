[project]
name = "token-seckill"
version = "0.1.0"
description = "TokenSeckill - 限量 Token 套餐高并发秒杀平台"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiomcache>=0.8.2",
  "aiomysql>=0.2.0",
  "cachetools>=5.5.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "langchain-core>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "orjson>=3.10.0",
  "prometheus-client>=0.21.0",
  "pydantic-settings>=2.10.0",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "structlog>=25.1.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "fakeredis[lua]>=2.30.0",
  "httpx>=0.28.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[project.scripts]
tokenseckill-api = "token_seckill.main:run"
tokenseckill-worker = "token_seckill.workers.grant_consumer:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_seckill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
